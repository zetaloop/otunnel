[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "otunnel"
version = "0.1.0"
edition = "2024"
description = "Concurrent MCP tunnel client and embedding library"
license = "MIT"
repository = "https://github.com/zetaloop/otunnel"
readme = "README.md"
keywords = ["mcp", "tunnel", "openai", "stdio"]
categories = ["network-programming", "command-line-utilities"]

[profile.release]
lto = "thin"
strip = true

[features]
default = ["cli"]
cli = ["dep:axum", "dep:clap", "dep:clap_complete", "dep:csv", "dep:tempfile", "dep:tracing-subscriber", "dep:which"]

[[bin]]
name = "otunnel"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", optional = true }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["env"], optional = true }
clap_complete = { version = "4.6.9", optional = true }
csv = { version = "1.4.0", optional = true }
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
humantime = "2.4.0"
hyper = { version = "1.11.1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "http2", "tokio"] }
percent-encoding = "2.3.2"
process-wrap = { version = "10.0.0", features = ["tokio1"] }
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rustls = "0.23.44"
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.2.0"
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "raw_value"] }
shell-words = "1.1.1"
tempfile = { version = "3.27.0", optional = true }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.5"
tokio-util = { version = "0.7.19", features = ["compat", "rt"] }
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"], optional = true }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
which = { version = "8.0.6", optional = true }

[target."cfg(windows)".dependencies]
async-io = "2.6.0"
socket2 = "0.6.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
