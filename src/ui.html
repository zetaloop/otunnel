<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>otunnel</title>
<style>
:root { font-family: system-ui, sans-serif; color-scheme: light dark; --bg: #f5f6fa; --card: #fff; --text: #222636; --muted: #646b7e; --line: #e3e6ee; --accent: #5863c8; --good: #168369; --bad: #b55b35; background: var(--bg); color: var(--text); }
@media (prefers-color-scheme: dark) { :root { --bg: #171820; --card: #20222d; --text: #eaebf3; --muted: #a3a9bd; --line: #343746; --accent: #afb5ff; --good: #73d6b9; --bad: #f4b38e; } }
* { box-sizing: border-box; }
body { margin: 0; padding: 48px 24px; }
main { max-width: 960px; margin: auto; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
h1 { font-size: 30px; letter-spacing: -.04em; margin: 0; }
h2 { font-size: 17px; margin: 0 0 20px; }
p { line-height: 1.6; }
a { color: var(--accent); text-underline-offset: 4px; }
small, .muted { color: var(--muted); }
.status { font-size: 14px; padding: 7px 12px; border-radius: 20px; background: var(--card); color: var(--bad); }
.status[data-ready="true"] { color: var(--good); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.stat, section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
.stat strong { display: block; font-size: 28px; font-weight: 550; margin-top: 8px; font-variant-numeric: tabular-nums; }
section { margin-bottom: 24px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
th { color: var(--muted); font-weight: 500; }
th, td { padding: 14px 12px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { padding-left: 0; }
tr:last-child td { border: 0; }
code { font: 13px ui-monospace, monospace; }
#error { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--bad); font-size: 14px; }
footer { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--muted); }
@media (max-width: 620px) { body { padding: 28px 16px; } .stats { grid-template-columns: repeat(2, 1fr); } .stat, section { padding: 18px; } footer { flex-wrap: wrap; } }
</style>
</head>
<body>
<main>
<header><div><h1>otunnel</h1><p class="muted">MCP tunnel activity</p></div><span id="state" class="status">Connecting</span></header>
<div class="stats">
<div class="stat"><small>In flight</small><strong id="in_flight">0</strong></div>
<div class="stat"><small>Completed</small><strong id="completed">0</strong></div>
<div class="stat"><small>Expired</small><strong id="expired">0</strong></div>
<div class="stat"><small>Failed</small><strong id="failed">0</strong></div>
</div>
<section><h2>Channels</h2><table><thead><tr><th>Channel</th><th>Server</th><th>Tools</th><th>Authentication</th></tr></thead><tbody id="channels"></tbody></table><p id="empty" class="muted">Discovering configured MCP services.</p></section>
<section id="error-panel" hidden><h2>Latest error</h2><div id="error"></div></section>
<footer><span id="started"></span><span><a href="/api/status">Status JSON</a> · <a href="/metrics">Metrics</a></span></footer>
</main>
<script>
const statusLabel = document.querySelector('#state');
const channelRows = document.querySelector('#channels');
const source = new EventSource('/api/events');
source.addEventListener('status', event => {
  const snapshot = JSON.parse(event.data);
  statusLabel.textContent = snapshot.ready ? 'Connected' : 'Starting';
  statusLabel.dataset.ready = String(snapshot.ready);
  for (const key of ['in_flight', 'completed', 'expired', 'failed']) {
    document.getElementById(key).textContent = snapshot[key].toLocaleString();
  }
  channelRows.replaceChildren();
  for (const [name, channel] of Object.entries(snapshot.channels)) {
    const row = document.createElement('tr');
    const identity = channel.server ? [channel.server.name, channel.server.version].filter(Boolean).join(' ') : '—';
    for (const text of [name, identity, channel.tools ?? '—', channel.authentication_required ? 'OAuth' : 'Available']) {
      const cell = document.createElement('td');
      cell.textContent = String(text);
      row.append(cell);
    }
    channelRows.append(row);
  }
  document.querySelector('#empty').hidden = channelRows.childElementCount > 0;
  document.querySelector('#started').textContent = `Started ${new Date(snapshot.started_at * 1000).toLocaleString()}`;
  document.querySelector('#error-panel').hidden = !snapshot.last_error;
  document.querySelector('#error').textContent = snapshot.last_error ?? '';
});
source.onerror = () => {
  statusLabel.textContent = 'Disconnected';
  statusLabel.dataset.ready = 'false';
};
window.addEventListener('pagehide', () => source.close());
</script>
</body>
</html>
